<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube HDR Cleaner</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Status icons (Lucide-style strokes), shown via <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-blocked" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-dimming" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
    <symbol id="i-force" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
    <symbol id="i-allowed" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-sdr" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
    <symbol id="i-idle" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  </svg>

  <!-- Header -->
  <header class="hdr">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
      <span class="brand-name">YouTube HDR Cleaner</span>
      <span class="brand-ver"></span>
    </div>
    <label class="sw" title="Turn YouTube HDR Cleaner on or off">
      <input type="checkbox" id="powerToggle" checked aria-label="Enable YouTube HDR Cleaner" />
      <span class="sw-track"></span>
    </label>
  </header>

  <!-- Status card -->
  <section class="status" id="statusCard" aria-live="polite">
    <div class="status-icon" id="statusIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-idle"/></svg></div>
    <div class="status-body">
      <div class="status-top">
        <div class="status-title" id="statusTitle">Checking…</div>
        <span class="badge" id="hdrBadge" hidden></span>
      </div>
      <div class="status-sub" id="statusSub"></div>
    </div>
  </section>

  <!-- Brightness -->
  <section class="sec" id="brightnessSec">
    <div class="sec-head">
      <div class="sec-title">Brightness</div>
      <div class="bval" id="bval">—</div>
    </div>

    <div class="seg" role="radiogroup" aria-label="Brightness mode">
      <label><input type="radio" name="mode" id="modeAuto" value="auto" /><span>Auto</span></label>
      <label><input type="radio" name="mode" id="modeManual" value="manual" /><span>Manual</span></label>
    </div>

    <input type="range" id="slider" min="20" max="100" step="1" value="72" aria-label="Brightness" />
    <div class="smarks">
      <span>Dimmer</span>
      <span>Brighter</span>
    </div>
    <p class="hint" id="brightnessHint"></p>
  </section>

  <!-- Settings -->
  <section class="sec">
    <label class="setting-row" id="channelRow" hidden>
      <div class="setting-text">
        <div class="setting-name">Keep HDR for this channel</div>
        <div class="setting-hint" id="channelHint"></div>
      </div>
      <span class="sw amber">
        <input type="checkbox" id="channelToggle" aria-label="Keep HDR for this channel" />
        <span class="sw-track"></span>
      </span>
    </label>
    <label class="setting-row">
      <div class="setting-text">
        <div class="setting-name">Dim every video</div>
        <div class="setting-hint">Also dims standard videos, not just HDR</div>
      </div>
      <span class="sw amber">
        <input type="checkbox" id="forceToggle" aria-label="Dim every video" />
        <span class="sw-track"></span>
      </span>
    </label>
    <div class="kept" id="keptList" hidden>
      <div class="kept-label">HDR kept for</div>
      <ul id="keptItems"></ul>
    </div>
  </section>

  <!-- Stats -->
  <section class="sec">
    <div class="sec-label">Your stats</div>

    <div class="stats-grid">
      <div class="stat">
        <div class="stat-val" id="statVideos">—</div>
        <div class="stat-lbl">HDR videos</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statTime">—</div>
        <div class="stat-lbl">Time dimmed</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statToday">—</div>
        <div class="stat-lbl">Today</div>
      </div>
    </div>

    <div class="type-bar" aria-hidden="true">
      <div class="type-seg type-hlg" id="hlgBar"></div>
      <div class="type-seg type-pq"  id="pqBar"></div>
    </div>
    <div class="legend">
      <span><i class="ldot hlg"></i>Broadcast HDR <b id="hlgCount">0</b></span>
      <span><i class="ldot pq"></i>HDR10 / Dolby Vision <b id="pqCount">0</b></span>
    </div>

    <div class="comfort">
      <svg class="comfort-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <div class="comfort-body">
        <div class="comfort-val" id="comfortVal">No data yet</div>
        <div class="comfort-sub" id="comfortSub">Watch an HDR video to start tracking</div>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
